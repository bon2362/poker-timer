name: Keep test Supabase awake

# Supabase pauses a free project after 7 days without requests, and after
# 90 days paused it can no longer be restored. The test project
# (poker-timer-test) is used only by e2e tests, so it can sit idle for months.
# This job sends one read request every 3 days so the project never pauses.

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the test database
        run: |
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/app_config?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase answered HTTP $status"
          test "$status" = "200"
        env:
          # Test Supabase project (poker-timer-test), never production.
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}

      # GitHub turns off scheduled workflows in a public repository after
      # 60 days without commits. Re-enabling the workflow resets that timer.
      - name: Keep this schedule from being disabled
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
